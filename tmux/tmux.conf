# ~/.tmux.conf - tmux configuration optimized for LazyVim

# Change prefix to Ctrl+Space (minimal conflicts with LazyVim)
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Enable mouse support (useful for pane selection without keybindings)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Split panes using | and - (easier to remember than % and ")
# Use Shift+\ for | and regular - for horizontal line
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Alternative: use easier keys
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation (Ctrl+Space then h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (Ctrl+Space then H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config file with Ctrl+Space then r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable vi mode for copy mode (works well with Vim muscle memory)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Don't exit copy mode after mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Fast window switching (Ctrl+Space then Ctrl+Space to toggle between windows)
bind C-Space last-window

# Floating window picker - shows list of windows (Ctrl+Space then w)
bind w choose-tree -Zw

# Floating session picker - shows list of sessions (Ctrl+Space then s)
bind S choose-tree -Zs

# Create new window with current path
bind c new-window -c "#{pane_current_path}"

# Enable true color support (important for LazyVim themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce escape time (improves Vim responsiveness)
set -sg escape-time 10

# Focus events enabled for vim autoread
set -g focus-events on

# Status bar customization
set -g status-position bottom
set -g status-style bg=colour234,fg=colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

# Window status
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
